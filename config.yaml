# ============================================================
# Iteracja: zmieniasz wartosci tutaj (run.py) lub siatke w experiments.py.
# ============================================================
paths:
  pdb_clean: pdb_clean
  pdb_raw: pdb_raw          # do auto-detekcji miejsca aktywnego (kofaktor)
  outputs: outputs

backend:
  use_gpu: false            # true -> zawsze CuPy (eig na GPU)
  auto_gpu: false           # GPU wolniejsze przy N<~2000 (patrz bench.py); on dla duzych ukladow
  n_gpu_min: 700            # prog N, powyzej ktorego oplaca sie GPU
  n_workers: 3              # MP po targetach (gdy nie ma GPU)

data:
  chain_select: largest     # all | largest | <ID lancucha>
  active_cutoff: 6.0        # A od kofaktora -> miejsce aktywne
  # cofactor_codes: [GDP, GNP, ADP, ATP]   # null => domyslna lista nukleotydow

graph:
  variant: cutoff           # cutoff | knn
  params: {cutoff: 8.0}

hamiltonian:
  variant: laplacian        # laplacian | adjacency | tight_binding
  params: {}

metric:
  metric: time_avg          # time_avg | coherent | classical | contrast
  t_max: 20.0
  n_t: 64
  # t_star: null

ranking:
  mode: fluctuation         # fluctuation | active_site
  use_graph_distance: true
  d_min: 3
  d_max: 8
  normalize: zscore         # active_site: zscore | zabs | distance | none
  smooth: 0                 # wygladzanie przestrzenne score (0=off)
  beta: 0.5
  burial: 0                 # >0 => preferencja powierzchni (surface)
  top: 5

scoring:
  contact_cutoff: 5.0
  ks: [5, 10, 20]
